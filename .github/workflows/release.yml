# Push a tag like v2.1.0 to build the installer and the portable exe and
# publish them as a GitHub release. The in-app updater downloads them from the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # vgamepad's setup otherwise launches the ViGEmBus driver installer and
      # waits forever for a click; the build machine doesn't need the driver.
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check APP_VERSION matches the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path MW5_MECHMAPPER.py -Pattern '^APP_VERSION = "([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          if ($ver -ne $tag) { throw "APP_VERSION is $ver but the tag is $tag - update APP_VERSION first." }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build exe and installer
        shell: cmd
        run: build.bat

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist\MechMapper-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "The installer wasn't built." }
          gh release create "${{ github.ref_name }}" $setup.FullName dist\MW5_MECHMAPPER.exe --title "Mech Mapper ${{ github.ref_name }}" --generate-notes
