# Push a tag like v2.1.0 to build the installer and the portable exe and
# publish them as a GitHub release. The in-app updater downloads them from the latest release.
# Running it by hand (Actions > Release > Run workflow) only builds, and keeps the files as a run artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check APP_VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path MW5_MECHMAPPER.py -Pattern '^APP_VERSION = "([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          if ($ver -ne $tag) { throw "APP_VERSION is $ver but the tag is $tag - update APP_VERSION first." }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install "pygame>=2.1" pyinstaller
          # vgamepad 0.1.0's setup.py launches the ViGEmBus driver installer and waits
          # for a click, which hangs an unattended build. Install it from a copy with
          # that call disabled (the build machine doesn't need the driver).
          $meta = Invoke-RestMethod https://pypi.org/pypi/vgamepad/0.1.0/json
          $sdist = ($meta.urls | Where-Object packagetype -eq 'sdist').url
          Invoke-WebRequest $sdist -OutFile vgamepad.tar.gz
          tar -xzf vgamepad.tar.gz
          $setup = 'vgamepad-0.1.0\setup.py'
          (Get-Content $setup -Raw).Replace('subprocess.call(', 'print(') | Set-Content $setup
          python -m pip install .\vgamepad-0.1.0
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build exe and installer
        shell: cmd
        run: build.bat

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist\MechMapper-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "The installer wasn't built." }
          gh release create "${{ github.ref_name }}" $setup.FullName dist\MW5_MECHMAPPER.exe --title "Mech Mapper ${{ github.ref_name }}" --generate-notes

      - name: Keep the build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: mech-mapper-build
          path: dist/*.exe
